<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Task Management Application</h1>
        <button id="darkModeToggle">Toggle Dark Mode</button>
    </header>
    <main>
        <section id="taskInputForm">
            <h2>Add New Task</h2>
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="Task Title" required>
                <select id="taskPriority">
                    <option value="overdue">Overdue</option>
                    <option value="urgent">Urgent</option>
                    <option value="due-soon">Due Soon</option>
                    <option value="upcoming">Upcoming</option>
                </select>
                <input type="date" id="taskDate" required>
                <input type="text" id="taskTags" placeholder="Tags (comma-separated)">
                <button type="submit">Add Task</button>
            </form>
        </section>
        <section id="statisticsDashboard">
            <div class="card">Total Tasks: <span id="totalTasks">0</span></div>
            <div class="card">Completed Tasks: <span id="completedTasks">0</span></div>
            <div class="card">Overdue Tasks: <span id="overdueTasks">0</span></div>
            <div class="card">Urgent Tasks: <span id="urgentTasks">0</span></div>
            <div class="card">Due Soon Tasks: <span id="dueSoonTasks">0</span></div>
        </section>
        <section id="taskListContainer">
            <h2>Task List</h2>
            <ul id="taskList"></ul>
        </section>
    </main>
    <div id="editModal">
        <h2>Edit Task</h2>
        <form id="editForm">
            <input type="text" id="editTaskTitle" required>
            <button type="submit">Save Changes</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>

<style>
    /* Global Styles */
    body {
        font-family: Arial, sans-serif;
        transition: background-color 0.3s;
    }
    header {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        padding: 1rem;
        text-align: center;
    }
    main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
    }
    .card {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        padding: 1rem;
        margin: 0.5rem;
        border-radius: 10px;
        width: 200px;
        text-align: center;
    }
    /* Dark Mode Styles */
    body.dark {
        background-color: #111;
        color: #fff;
    }
    /* Responsiveness */
    @media (max-width: 600px) {
        body {
            padding: 0.5rem;
        }
    }
</style>

<script>
    document.getElementById('darkModeToggle').onclick = function() {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    };

    // Load dark mode preference 
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }

    let tasks = [];

    document.getElementById('taskForm').onsubmit = function(event) {
        event.preventDefault();
        addTask();
        this.reset();
    };

    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const priority = document.getElementById('taskPriority').value;
        const date = document.getElementById('taskDate').value;
        const tags = document.getElementById('taskTags').value.split(',');
        const task = { title, priority, date, tags, completed: false };
        tasks.push(task);
        updateTaskList();
    }

    function updateTaskList() {
        const taskListElement = document.getElementById('taskList');
        taskListElement.innerHTML = '';
        tasks.forEach((task, index) => {
            const li = document.createElement('li');
            li.textContent = task.title;
            taskListElement.appendChild(li);
        });
        updateStatistics();
        saveTasksToLocalStorage();
    }

    function updateStatistics() {
        document.getElementById('totalTasks').textContent = tasks.length;
        document.getElementById('completedTasks').textContent = tasks.filter(t => t.completed).length;
        document.getElementById('overdueTasks').textContent = tasks.filter(t => new Date(t.date) < new Date()).length;
        // Add more statistics as needed
    }

    function saveTasksToLocalStorage() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }
</script>
